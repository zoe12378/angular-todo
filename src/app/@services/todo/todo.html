<section class="todoapp">
	<header class="header">
		<app-header [title]="title" [todoDataList]="todoDataList"></app-header>
	</header>
	<section class="main">
		<app-section 
			(onDeleteItem)="delete($event)"
			[nowTodoList]="nowTodoList" 
			[todoDataList]="todoDataList" 
			[todoCompleted]="todoCompleted">
		</app-section>
	</section>
	<footer class="footer" style = "display: block;">
		<app-footer 
			(onClearCompleted)="clear()"
			(onStatusTypeChange)="statusTypeChange($event)"
			[todoActive]="todoActive" 
			[todoCompleted]="todoCompleted" 
			[todoDataList]="todoDataList">
			[nowTodoStatusType]="nowTodoStatusType"
		</app-footer>
	</footer>
</section>
