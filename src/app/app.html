<section class="todoapp">
	<header class="header">
		<h1>{{title()}}</h1>
		<input class="new-todo" 
		#todoInput 
		(keyup.enter) = "add(todoInput.value); todoInput.value = ''" 
		[placeholder]="placeholder()" 
		autofocus>
	</header>
	<section class="main">
		<input id="toggle-all" class="toggle-all" type="checkbox" 
		[checked] = "toggleAllBtn" (change) = "toggleAll()">
		<label for="toggle-all">Mark all as complete</label>
		<ul class="todo-list">
			@for (item of todoDataList; track $index) {
			<li [class.completed]="item.Status" [class.editing]="item.Editing">
				<div class="view">
					<input class="toggle" type="checkbox"
					[checked] = "item.Status" (change) = "clickCheck(item)">
					<label (dblclick) = "edit(item)">{{item.Thing}}</label>
					<button (click) = "delete($index)" class = "destroy"></button>
				</div>
				@if (item.Editing) {
					<input 
					[value] = 'item.Thing'
					#itemInput 
					(keyup.enter) = 'update(item,itemInput.value)'
					(blur) = "update(item,itemInput.value)"
					(mouseenter) = "itemInput.focus()"
					class = "edit" />
				}
			</li>
			}
		</ul>
	</section>
	<footer class="footer">
		<span class="todo-count"></span>
		<ul class="filters">
			<li>
				<a [class.selected] = "nowTodoStatusType === TodoStatusType.All" 
				(click) = "setTodoStatusType(TodoStatusType.All)"
				href="#/" >All</a>
			</li>
			<li>
				<a [class.selected] = "nowTodoStatusType === TodoStatusType.Active" 
				(click) = "setTodoStatusType(TodoStatusType.Active)"
				href="#/active">Active</a>
			</li>
			<li>
				<a [class.selected] = "nowTodoStatusType === TodoStatusType.Completed" 
				(click) = "setTodoStatusType(TodoStatusType.Completed)"
				href="#/completed">Completed</a>
			</li>
		</ul>
		<button class="clear-completed">Clear completed</button>
	</footer>
</section>
